name: CI

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
    branches: [main]
  workflow_dispatch:

# The chip/board database lives in its own package (packages/esp-device-pack) and is
# released by .github/workflows/device-pack.yml — see §6.2 task 4.2.

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: test · build · package
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Unit tests
        run: npm test

      # `npm run build` runs `tsc --noEmit` first, then bundles the extension (esbuild)
      # and the WebView (vite), so a type error fails the job before any packaging.
      - name: Build extension + WebView
        run: npm run build

      - name: Package VSIX
        run: >
          npx --yes @vscode/vsce@4.0.0 package
          --out esp-pin-planner.vsix

      - uses: actions/upload-artifact@v4
        with:
          name: esp-pin-planner-vsix
          path: esp-pin-planner.vsix
          if-no-files-found: error

  release:
    name: Attach VSIX to the GitHub release
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: esp-pin-planner-vsix

      - uses: softprops/action-gh-release@v2
        with:
          files: esp-pin-planner.vsix
          generate_release_notes: true

      # Marketplace / Open VSX publishing is intentionally left out: it needs a real
      # `publisher` id plus a VSCE_PAT / OVSX_PAT secret, and .vsix signing needs a
      # certificate. Wire those in once the release identity is decided (§3.32).
